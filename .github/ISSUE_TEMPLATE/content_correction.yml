name: Content correction
description: Correct a learning item, creator record or official opportunity
title: "[Content]: "
labels: ["content", "research"]
body:
  - type: dropdown
    id: type
    attributes:
      label: Content type
      options:
        - Japanese learning content
        - Creator record
        - Opportunity / scholarship
    validations:
      required: true
  - type: input
    id: item
    attributes:
      label: Item ID or title
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is wrong?
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Official source URL
      description: Required for creator and opportunity corrections.
  - type: textarea
    id: evidence
    attributes:
      label: Quoted evidence
      description: Quote the exact relevant source text. Do not infer a deadline from a publication date or filename.
